name: Build Matrix

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'A.R.T Version (format: x.y.z)'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_version: ubuntu22.04
            arch: amd64
            runner: ubuntu-22.04
          - os_version: ubuntu24.04
            arch: amd64
            runner: ubuntu-24.04
          - os_version: ubuntu22.04
            arch: arm64
            runner: ubuntu-22.04-arm
          - os_version: ubuntu24.04
            arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip unzip
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install pyinstaller --break-system-packages

      - name: Replace amd64 with arm64 (ARM64 only)
        if: matrix.arch == 'arm64'
        run: |
          sed -i 's/amd64/arm64/g' build.py scripts/utils.py

      - name: Run build script and post-process
        id: build
        run: |
          # 切换时区为上海
          export TZ='Asia/Shanghai'

          # 赋予所有文件完整权限
          chmod -R 777 *

          # 删除 build.py 中的 Cleanup 相关代码
          sed -i '/^[[:space:]]*# Cleanup$/d; /^[[:space:]]*remove_generated_path(CACHE_DIR)$/d' build.py

          # 创建缓存目录
          mkdir -p .art_builder_cache

          # 执行构建脚本，输出重定向到日志
          VERSION_INPUT="${{ github.event.inputs.version }}"
          if [ -n "$VERSION_INPUT" ]; then
            if ! echo "$VERSION_INPUT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: version must be in format x.y.z where x,y,z are numbers."
              exit 1
            fi
            ./build.py --version "$VERSION_INPUT" > .art_builder_cache/build_out.log 2>&1
          else
            ./build.py > .art_builder_cache/build_out.log 2>&1
          fi

          # 查找并解压 zip 文件
          mkdir -p UNPACK
          for zipfile in A.R.T_*.zip A.R.T-*.zip; do
            if [ -f "$zipfile" ]; then
              unzip -q "$zipfile" -d UNPACK/
              BASE_NAME="${zipfile%.zip}"
              break
            fi
          done

          # 计算构建日期（上海时间）
          BUILD_DATE=$(date +'%Y%m%d_%H%M%S')

          # 计算 workspace artifact 名称
          if [ -n "$VERSION_INPUT" ]; then
            WORKSPACE_NAME="workspace-${{ matrix.os_version }}-${{ matrix.arch }}-${BUILD_DATE}-${VERSION_INPUT}"
          else
            WORKSPACE_NAME="workspace-${{ matrix.os_version }}-${{ matrix.arch }}-${BUILD_DATE}"
          fi

          echo "workspace_name=$WORKSPACE_NAME" >> $GITHUB_OUTPUT
          echo "unpack_name=$BASE_NAME" >> $GITHUB_OUTPUT

      - name: Upload entire workspace
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.workspace_name }}
          path: ${{ github.workspace }}

      - name: Upload UNPACK directory
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.unpack_name }}
          path: UNPACK/

      - name: Upload build cache
        uses: actions/upload-artifact@v4
        with:
          name: art_builder_cache
          path: .art_builder_cache/
